[project]
name = "tero"
version = "0.1.0"
description = "Asistente de voz de escritorio, activado por tecla"
authors = [
    { name = "Andres Mingarro", email = "andy.mingarro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5",
    "numpy>=2.0",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "ollama>=0.6.2",
    "httpx>=0.28.1",
    "websockets>=17.1",
    "psutil>=7.0",
    # Linux only: the global key comes from /dev/input via evdev, Whisper
    # runs on CUDA, and the soul-connector needs the Qt backend of
    # pywebview (QT_QPA_PLATFORM=xcb, see README).
    "evdev>=1.7 ; sys_platform == 'linux'",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.26.0.51 ; sys_platform == 'linux'",
    "pywebview[qt]>=6.2.1 ; sys_platform == 'linux'",
    # macOS only: the global key comes from pynput (needs the Input
    # Monitoring permission), and pywebview uses the native Cocoa backend,
    # so no Qt extra.
    "pynput>=1.7 ; sys_platform == 'darwin'",
    "pywebview>=6.2.1 ; sys_platform == 'darwin'",
]

[tool.uv]
package = false
