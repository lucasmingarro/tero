[key]
# evdev key name (see: python -c "from evdev import ecodes; print([k for k in dir(ecodes) if k.startswith('KEY_')])")
name = "KEY_RIGHTCTRL"
# Threshold in seconds: below it is a short tap (toggle), above it is push-to-talk.
toggle_threshold_s = 0.35

# Per-OS override of the key: the names have nothing in common between
# platforms, because each one comes from a different library (evdev above,
# pynput here). Everything else in [key] is shared.
[key.macos]
# pynput key name (see: uv run python -c "from pynput.keyboard import Key; print(sorted(k.name for k in Key))")
# A single character works too, e.g. name = "ñ".
name = "ctrl_r"

[audio]
sample_rate_hz = 16000
channels = 1

[stt]
# With a Groq key in ~/.config/tero/groq_key (see voice/stt.py), this is
# only the offline fallback: it loads only if Groq fails, not at startup.
# With no key, it is the usual transcription, and it loads at startup.
#
# "large-v3": accuracy is preferred over latency. The problem of
# misheard names is not about one particular city, it will show up all the
# time with any proper noun -- better to solve it at the root than by hints.
model = "large-v3"
device = "auto"
compute_type = "default"

[tts]
voice = "es_AR-daniela-high"

[brain]
model = "qwen3:4b-instruct"

[spotify]
# App created at https://developer.spotify.com/dashboard, Web API only.
# Not a secret: a public app (PKCE) client_id does not need hiding.
client_id = "5402ca5c0ce646a29462c39eed5b91ea"
